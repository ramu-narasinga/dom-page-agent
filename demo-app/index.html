<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business License Renewal Application</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="form-page">
    <h1>Business License Renewal Application</h1>
    <p class="subtitle">Form BL-402 &middot; Annual Renewal</p>

    <form id="renewalForm">
      <fieldset>
        <legend>Section 1 &mdash; Applicant &amp; Business Information</legend>

        <label for="fullName">Full legal name</label>
        <input type="text" id="fullName" name="fullName" />

        <label for="businessName">Business name / DBA</label>
        <input type="text" id="businessName" name="businessName" />

        <label for="businessType">Business type</label>
        <select id="businessType" name="businessType">
          <option value="">Select one</option>
          <option value="sole_proprietorship">Sole Proprietorship</option>
          <option value="llc">LLC</option>
          <option value="corporation">Corporation</option>
          <option value="partnership">Partnership</option>
        </select>

        <label for="taxId">Employer Identification Number / Tax ID</label>
        <input type="text" id="taxId" name="taxId" />

        <label for="street">Business address &mdash; street</label>
        <input type="text" id="street" name="street" />

        <label for="city">Business address &mdash; city</label>
        <input type="text" id="city" name="city" />

        <label for="state">Business address &mdash; state</label>
        <select id="state" name="state">
          <option value="">Select one</option>
          <option value="CA">California</option>
          <option value="NY">New York</option>
          <option value="TX">Texas</option>
          <option value="IL">Illinois</option>
          <option value="WA">Washington</option>
          <option value="MA">Massachusetts</option>
          <option value="CO">Colorado</option>
          <option value="GA">Georgia</option>
          <option value="OH">Ohio</option>
          <option value="FL">Florida</option>
        </select>

        <label for="zip">Business address &mdash; ZIP</label>
        <input type="text" id="zip" name="zip" />

        <label for="email">Contact email</label>
        <input type="email" id="email" name="email" />

        <label for="phone">Contact phone</label>
        <input type="tel" id="phone" name="phone" />
      </fieldset>

      <fieldset>
        <legend>Section 2 &mdash; Renewal &amp; Compliance Details</legend>

        <label for="yearsInOperation">Years in operation</label>
        <input type="number" id="yearsInOperation" name="yearsInOperation" min="0" />

        <label for="revenueBracket">Annual revenue bracket</label>
        <select id="revenueBracket" name="revenueBracket">
          <option value="">Select one</option>
          <option value="under_50k">Under $50k</option>
          <option value="50k_250k">$50k&ndash;$250k</option>
          <option value="250k_1m">$250k&ndash;$1M</option>
          <option value="over_1m">Over $1M</option>
        </select>

        <div class="checkbox-row">
          <input type="checkbox" id="hasEmployees" name="hasEmployees" />
          <label for="hasEmployees">This business has employees</label>
        </div>

        <div id="employeeCountRow" class="conditional-field" style="display: none;">
          <label for="employeeCount">Number of employees</label>
          <input type="number" id="employeeCount" name="employeeCount" min="0" />
        </div>

        <label for="renewalDate">Preferred renewal date</label>
        <input type="date" id="renewalDate" name="renewalDate" />

        <div class="checkbox-row">
          <input type="checkbox" id="certify" name="certify" required />
          <label for="certify">I certify the information provided is accurate</label>
        </div>
      </fieldset>

      <button type="submit" id="submitBtn">Submit Renewal</button>
    </form>

    <p id="result" class="result"></p>
  </main>

  <script>
    const hasEmployeesCheckbox = document.getElementById('hasEmployees');
    const employeeCountRow = document.getElementById('employeeCountRow');
    hasEmployeesCheckbox.addEventListener('change', () => {
      employeeCountRow.style.display = hasEmployeesCheckbox.checked ? 'block' : 'none';
    });

    document.getElementById('renewalForm').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('result').textContent = 'Renewal application submitted.';
    });
  </script>
</body>
</html>
